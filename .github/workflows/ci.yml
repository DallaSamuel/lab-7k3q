name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests (sizing maths, importer)
        run: node --test
      - name: No external requests in the app
        run: |
          ! grep -nE 'https?://(fonts\.|cdn\.|unpkg|cdnjs)' index.html
      - name: Pages are served only from files in the repo
        run: test -f index.html && test -f sw.js && test -f manifest.webmanifest
